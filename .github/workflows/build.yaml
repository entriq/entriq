name: build

on:
  push:
    tags:
      - "**"

jobs:

  build:
    name: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: ghcr::login
        uses: docker/login-action@v3
        with:
         registry: ghcr.io
         username: ${{ github.actor }}
         password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker::build
        run:
          docker build . --tag ghcr.io/entriq/entriq:${{ github.ref_name }}

      - name: docker::publish
        run:
          docker push ghcr.io/entriq/entriq:${{ github.ref_name }}
