# Gateway Configuration Example
# Copy this file to entriq.yaml and customize for your environment

# Global settings
global:
  # Default timeout for all services (can be overridden per service/route)
  timeout: 30s

  # Default retry policy (can be overridden per service — all fields optional)
  retry:
    max_attempts: 3        # Default: 3
    backoff: exponential   # Default: exponential — options: exponential, linear, constant
    initial_interval: 100ms # Default: 100ms
    max_interval: 2s       # Default: 2s
    multiplier: 2.0        # Default: 2.0 — only used for exponential backoff

  # HTTP connection pool settings (all fields optional)
  connection_pool:
    max_idle_conns: 100        # Default: 100
    max_idle_conns_per_host: 10 # Default: 10
    idle_conn_timeout: 90s     # Default: 90s

  # Forward authentication (Traefik ForwardAuth style)
  forward_auth:
    enabled: true                        # Enable/disable forward auth globally
    url: http://auth-service:8083/verify  # URL of auth service to verify requests
    timeout: 5s                          # Timeout for auth service requests
    # Headers to forward to auth service (defaults shown - omit to forward all headers)
    forward_headers:
      - "Authorization"
      - "Cookie"
      - "X-Request-ID"
      - "X-Forwarded-For"
      - "X-Forwarded-Host"
      - "X-Forwarded-Proto"
      - "X-Forwarded-Uri"
    # Headers to copy from auth response to backend request
    response_headers:
      - "X-Forwarded-User"
      - "X-Auth-User"
      - "X-Auth-Email"
      - "X-Auth-Name"
      - "X-Auth-Groups"
    trust_forwarded_headers: true        # Automatically add X-Forwarded-* headers

# Header manipulation rules (applied to all proxied requests — all fields optional)
headers:
  # Headers to add to all requests
  # Default: X-Gateway-Version: entriq/{version}
  add:
    X-Gateway-Version: "entriq/1.0"  # override the default version header

  # Headers to forward from client
  # Default: X-Request-ID, Content-Type, Accept
  forward:
    - "X-Request-ID"
    - "Content-Type"
    - "Accept"

  # Headers to remove before forwarding (default: none)
  remove:
    - "X-Internal-Token"

  # Automatically add X-Forwarded-* headers (For, Proto, Host) — default: false
  x_forwarded_headers: true

# Microservices configuration
services:
  # Example user service
  - name: user-service
    base_url: http://user-service:8081
    timeout: 10s                         # Service-level timeout (overrides gateway default)

    # Service-level retry policy (overrides gateway default)
    retry:
      max_attempts: 2
      backoff: exponential
      initial_interval: 50ms
      max_interval: 1s

    routes:
      # Prefix match: /users, /users/123, /users/123/profile all match
      - path: /users
        method: ["GET", "POST", "PUT", "DELETE"]
        match_type: prefix
        strip_path: false                # If true, "/users/123" becomes "/123" when forwarding
        # Forward auth inherits from global setting (enabled: true)

      # Exact match: only /users/bulk matches
      - path: /users/bulk
        method: ["POST"]
        match_type: exact
        timeout: 60s                     # Route-level timeout (overrides service and gateway)
        headers:
          add:
            X-Operation: "bulk-import"   # Route-specific headers
        # Disable auth for this specific route
        forward_auth:
          enabled: false

  # Example transaction service
  - name: transaction-service
    base_url: http://transaction-service:8082
    timeout: 15s
    routes:
      - path: /v1.0/transaction
        match_type: prefix
        # If method not specified, all HTTP methods are allowed

  # Example authentication service
  - name: auth-service
    base_url: http://auth-service:8083
    timeout: 5s
    routes:
      # Login endpoint - no auth required
      - path: /auth/login
        method: ["POST"]
        match_type: exact
        forward_auth:
          enabled: false                 # Public endpoint, no auth needed

      # Logout endpoint - auth required (inherits from global)
      - path: /auth/logout
        method: ["POST"]
        match_type: exact

      # Token refresh endpoint - auth required (inherits from global)
      - path: /auth/refresh
        method: ["POST"]
        match_type: exact

      # Verify endpoint - this is the actual forward auth endpoint
      - path: /auth/verify
        method: ["GET", "POST"]
        match_type: exact
        forward_auth:
          enabled: false                 # Don't auth the auth endpoint itself!

# CORS configuration
cors:
  # Allowlist of origins. Defaults to "*" (all origins) if omitted.
  # Override with explicit origins in production to restrict access.
  # Use "*" to allow all origins (public APIs only — not recommended with credentials).
  origins:
    - "https://app.example.com"
    - "https://admin.example.com"
    # - "http://localhost:3000"   # uncomment for local development
    # - "*"                       # allow all origins (default)

  # HTTP methods browsers are allowed to use cross-origin.
  # Optional — defaults to: GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS
  methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "PATCH"
    - "HEAD"
    - "OPTIONS"

  # Request headers browsers are allowed to send cross-origin.
  # Optional — defaults to: Origin, Content-Type, Content-Length,
  #            Accept-Encoding, X-CSRF-Token, Authorization, X-Request-ID
  headers:
    - "Origin"
    - "Content-Type"
    - "Content-Length"
    - "Accept-Encoding"
    - "X-CSRF-Token"
    - "Authorization"
    - "X-Request-ID"

  # Response headers that JavaScript in the browser is allowed to read.
  # Optional — defaults to: Content-Length
  exposed_headers:
    - "Content-Length"

  # Allow browsers to send cookies and HTTP auth headers cross-origin.
  # When true, origins must be explicit — wildcards are rejected by browsers.
  # Optional — defaults to false
  allow_credentials: false

# Logging configuration for proxied requests (all fields optional)
logging:
  enabled: false      # Default: false
  level: info         # Default: info — options: debug, info, warn, error
  log_body: false     # Default: false — include request/response bodies in logs
  max_body_size: 1024 # Default: 1024 bytes

  # Fields to include in logs
  # Default: timestamp, method, path, status_code, latency, service
  include:
    - timestamp
    - method
    - path
    - status_code
    - latency
    - service
    - error
