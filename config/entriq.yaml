# Gateway Configuration
# Override with CONFIG_PATH environment variable if needed

gateway:
  default_timeout: 30s
  default_retry:
    max_attempts: 3
    backoff: exponential
    initial_interval: 100ms
    max_interval: 2s
    multiplier: 2.0
  connection_pool:
    max_idle_conns: 100
    max_idle_conns_per_host: 10
    idle_conn_timeout: 90s

headers:
  add:
    X-Gateway-Version: "1.0"
  forward:
    - "Authorization"
    - "User-Agent"
    - "X-Request-ID"
    - "Content-Type"
    - "Accept"
  remove: []
  x_forwarded_headers: true

services:
  # Example service - replace with your actual services
  - name: example-service
    base_url: http://localhost:8081
    timeout: 10s
    routes:
      - path: /example
        method: [ "GET" ]
        match_type: prefix
        strip_path: false

logging:
  enabled: true
  level: info
  log_body: false
  max_body_size: 1024
  include:
    - timestamp
    - method
    - path
    - status_code
    - latency
    - service_name
