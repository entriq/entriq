global:
  timeout: 30s
  connection_pool:
    max_idle_conns: 100
    max_idle_conns_per_host: 10
    idle_conn_timeout: 90s
  forward_auth:
    enabled: true
    url: http://localhost:8090/v1.0/verify
    timeout: 5s
    forward_headers:
      - "Authorization"
      - "X-Request-ID"
    response_headers:
      - "X-User"
    trust_forwarded_headers: true

headers:
  add:
    X-Gateway-Version: "1.0"
  forward:
    - "X-Request-ID"
    - "Content-Type"
    - "Accept"
  remove: []
  x_forwarded_headers: true

logging:
  enabled: true
  level: info
  log_body: false
  max_body_size: 1024
  include:
    - timestamp
    - method
    - path
    - status_code
    - latency
    - service_name

services:

  - name: platform-core
    base_url: http://localhost:8040
    timeout: 10s
    routes:
      - path: /v1.0
        method: ["GET", "POST"]
        match_type: prefix
        strip_path: false

