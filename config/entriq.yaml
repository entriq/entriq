global:
  forward_auth:
    enabled: true
    url: http://localhost:8090/v1.0/verify
    timeout: 5s
    forward_headers:
      - "Authorization"
      - "X-Request-ID"
    response_headers:
      - "X-User"
    trust_forwarded_headers: true

services:

  - name: platform-core
    url: http://localhost:8040
    timeout: 10s
    routes:
      - path: /v1.0
        methods: ["GET", "POST"]
        match_type: prefix
        strip_path: false

